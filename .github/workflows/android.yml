name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Uses the repo's keystore secret when configured. Without it (a fork,
      # for instance) a throwaway key is generated so the build still succeeds.
      # APKs signed with a throwaway key cannot install over an app that was
      # installed with a different key without uninstalling it first.
      - name: Provide debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/debug.keystore"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set, generating a throwaway signing key."
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build with Gradle
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TrackyTime-debug
          # The ** also covers product-flavor output dirs (apk/<flavor>/debug/).
          path: app/build/outputs/apk/**/TrackyTime-*.apk
          if-no-files-found: error
